[project]
name = "nantral-platform"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "celery~=5.2",
    "crispy-bootstrap5~=0.6",
    "discord-webhook~=1.0",
    "django~=5.1",
    "django-celery-beat~=2.4",
    "django-ckeditor-5~=0.2",
    "django-crispy-forms~=1.14",
    "django-debug-toolbar~=4.1",
    "django-environ~=0.9",
    "django-extra-settings~=0.5",
    "django-modeltranslation~=0.18.11",
    "django-oidc-provider~=0.9.0",
    "django-push-notifications[apns-async, wp]~=3.3",
    "django-rest-passwordreset~=1.4",
    "django-simple-history~=3.10",
    "django-storages[boto3]~=1.13",
    "django-vite~=3.0",
    "djangorestframework~=3.15",
    "docutils",
    "factory-boy~=3.3",
    "flower~=2.0",
    "freezegun~=1.2",
    "gunicorn~=23.0",
    "matching~=1.4",
    "names~=0.3",
    "numpy>=1.21",
    "pillow>=9.2",
    "psycopg2-binary~=2.9",
    "pymemcache~=4.0",
    "pywebpush~=1.14",
    "redis~=5.0",
    "requests~=2.34",
    "six~=1.16",
    "pyjwt~=2.13",
    "jsonschema",
]

[dependency-groups]
dev = [
    "coverage~=7.3",
    "ruff~=0.15.4",
]

[tool.ruff]
line-length = 80

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle
    "C90",   # mccabe
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "B0",    # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "INT",   # flake8-gettext
    "TD",    # flake8-todos
    "ERA",   # eradicate
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # Pylint
    "FLY",   # flynt
    "NPY",   # NumPy-specific rules
    "AIR",   # Airflow
    "PERF",  # Perflint
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",    # line too long
    "S311",    # using random
    "SIM105",  # using try-except-pass
    "S110",    # using try-except-pass
    "PERF203", # using try-except in loops
    "RUF012",  # for typing only
    "ISC001",  # implicit str concat (interfere with formatter),
    "G00",     # logging format
    "DJ008",   # force __str__ on all django models
    "PLC0415", # import outside top level
]
allowed-confusables = [" "]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
section-order = [
    "future",
    "standard-library",
    "django",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
django = ["django"]
