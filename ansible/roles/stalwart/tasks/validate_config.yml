---

- name: Fail if required Stalwart settings not defined
  ansible.builtin.fail:
    msg: >
      You need to define a required configuration setting (`{{ item.name }}`).
  when: "item.when | bool and lookup('vars', item.name, defaults='') | string | length == 0"
  with_items:
    - { 'name': 'stalwart_domain', when: true }
    - { 'name': 'stalwart_hostname', when: true }
    - { 'name': 'stalwart_container_network', when: true }
    - { 'name': 'stalwart_database_hostname', when: true }
    - { 'name': 'stalwart_database_port', when: true }
    - { 'name': 'stalwart_database_username', when: true }
    - { 'name': 'stalwart_database_password', when: true }
    - { 'name': 'stalwart_database_name', when: true }
    - { 'name': 'stalwart_database_network', when: true }
    - { 'name': 'traefik_certs_dumper_dumped_certificates_path', when: true }
    - { 'name': 'traefik_identifier', when: true }
