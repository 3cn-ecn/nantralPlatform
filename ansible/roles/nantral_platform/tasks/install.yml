---

- name: Ensure Nantral Platform paths exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: '0750'
    owner: "{{ nantral_platform_user_name }}"
    group: "{{ nantral_platform_group_name }}"
  with_items:
    - path: "{{ nantral_platform_base_path }}"
      when: true
    - path: "{{ nantral_platform_container_src_path }}"
      when: "{{ nantral_platform_container_image_self_build }}"
  when: item.when | bool

- name: Ensure Nantral Platform support files installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ item }}.j2"
    dest: "{{ nantral_platform_base_path }}/{{ item }}"
    mode: '0640'
    owner: "{{ nantral_platform_user_name }}"
    group: "{{ nantral_platform_group_name }}"
  with_items:
    - labels
    - env
  register: nantral_platform_support_files_result

- name: Ensure Nantral Platform container image is pulled
  community.docker.docker_image_pull:
    name: "{{ nantral_platform_container_image }}"
    pull: always
  when: "not nantral_platform_container_image_self_build | bool"
  register: nantral_platform_container_image_pull_result
  retries: "{{ devture_playbook_help_container_retries_count }}"
  delay: "{{ devture_playbook_help_container_retries_delay }}"
  until: nantral_platform_container_image_pull_result is not failed

- when: nantral_platform_container_image_self_build | bool
  block:
    # A checkout owned by a different user (a uid change, an earlier clone by another user, etc.) would make the git task below fail on ownership or permissions.
    - name: Ensure Nantral Platform repository ownership is correct on self-build
      ansible.builtin.file:
        path: "{{ nantral_platform_container_src_path }}"
        state: directory
        owner: "{{ nantral_platform_user_name }}"
        group: "{{ nantral_platform_group_name }}"
        recurse: true

    - name: Ensure Nantral Platform repository is present on self-build
      ansible.builtin.git:
        repo: "{{ nantral_platform_container_image_self_build_repo }}"
        version: "{{ nantral_platform_container_image_self_build_repo_version }}"
        dest: "{{ nantral_platform_container_src_path }}"
        force: "yes"
      become: true
      become_user: "{{ nantral_platform_user_name }}"
      # Keep this even though the task above normalizes ownership. Git may still see an ownership mismatch when Ansible becomes an unprivileged user.
      environment:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: safe.directory
        GIT_CONFIG_VALUE_0: "{{ nantral_platform_container_src_path }}"
      register: nantral_platform_git_pull_results

    - name: Ensure Nantral Platform container image is built
      ansible.builtin.command:
        cmd: |-
          {{ devture_systemd_docker_base_host_command_docker }} buildx build
          --tag={{ nantral_platform_container_image }}
          --file={{ nantral_platform_container_src_path }}/deployment/containers/web/Dockerfile
          --target production
          {{ nantral_platform_container_src_path }}
      changed_when: true

- name: Ensure Celery is installed in production
  when: not nantral_platform_staging
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/install_celery.yml"

- name: Ensure Nantral Platform database is created
  ansible.builtin.include_role:
    name: galaxy/postgres
    tasks_from: util/prepare_managed_databases.yml

- name: Ensure Nantral Platform container network is created
  when: nantral_platform_container_network != 'host'
  community.general.docker_network:
    enable_ipv6: "{{ devture_systemd_docker_base_ipv6_enabled }}"
    name: "{{ nantral_platform_container_network }}"
    driver: bridge
    driver_options: "{{ devture_systemd_docker_base_container_networks_driver_options }}"

- name: Ensure Nantral Platform systemd service installed
  ansible.builtin.template:
    src: "{{ role_path }}/templates/systemd/nantral-platform.service.j2"
    dest: "{{ devture_systemd_docker_base_systemd_path }}/nantral-platform{{ '-staging' if nantral_platform_staging else '' }}.service"
    mode: '0644'
  register: nantral_platform_systemd_service_result

- name: Determine whether Nantral Platform needs a restart
  ansible.builtin.set_fact:
    nantral_platform_restart_necessary: >-
      {{
        nantral_platform_support_files_result.changed | default(false)
        or nantral_platform_systemd_service_result.changed | default(false)
        or nantral_platform_container_image_pull_result.changed | default(false)
      }}
