name: Deploy Server

on:
  push:
    branches:
      - master
    paths:
      - backend/**
      - deployment/**
      - frontend/**
      - email-templates-generator/**
      - .github/workflows/deploy-server.yml
      - .github/workflows/quality-frontend.yml
      - .github/workflows/quality-backend.yml
      - .github/workflows/quality-email-templates.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      email-templates: ${{ steps.filter.outputs.email-templates }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            email-templates:
              - 'email-templates-generator/**'

  frontend-quality:
    name: Test front end quality
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    uses: ./.github/workflows/quality-frontend.yml
    secrets: inherit

  backend-quality:
    name: Test Back End Quality
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    uses: ./.github/workflows/quality-backend.yml
    secrets: inherit

  email-templates-quality:
    name: Test Email Templates Quality
    needs: changes
    if: ${{ needs.changes.outputs.email-templates == 'true' }}
    uses: ./.github/workflows/quality-email-templates.yml
    secrets: inherit

  build-and-push:
    name: Build and push Docker images
    needs:
      - frontend-quality
      - backend-quality
      - email-templates-quality
    if: |
      always() &&
      (needs.frontend-quality.result == 'success' || needs.frontend-quality.result == 'skipped') &&
      (needs.backend-quality.result == 'success' || needs.backend-quality.result == 'skipped') &&
      (needs.email-templates-quality.result == 'success' || needs.email-templates-quality.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/containers/web/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Build and push Celery image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/containers/web/Dockerfile
          target: celery
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-celery:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-celery:latest
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

  backup-database:
    name: Create a backup of the database
    needs: build-and-push # prevent backup on failed workflows
    runs-on: ubuntu-latest
    steps:
      - name: Backup before deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INSTANCE_ADDRESS }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          script: |
            set -e
            cd nantralPlatform/deployment/scripts
            chmod +x db_backup.sh
            ./db_backup.sh --skip-success-notif

  deploy:
    name: Deploy on VPS
    needs:
      [ build-and-push, backup-database ]
    if: ${{ needs.build-and-push.result == 'success' && needs.backup-database.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INSTANCE_ADDRESS }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          script: |
            set -e
            cd nantralPlatform/deployment
            git pull
            sed -i '/^BACKEND_TAG=/d' .env
            echo "BACKEND_TAG=${{ github.sha }}" >> .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend celery celery-beat
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
