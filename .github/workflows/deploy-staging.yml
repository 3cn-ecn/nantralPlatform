name: Deploy Staging

on: workflow_dispatch

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  frontend-quality:
    name: Test front end quality
    uses: ./.github/workflows/quality-frontend.yml
    secrets: inherit

  backend-quality:
    name: Test Back End Quality
    uses: ./.github/workflows/quality-backend.yml
    secrets: inherit

  email-templates-quality:
    name: Test Email Templates Quality
    uses: ./.github/workflows/quality-email-templates.yml
    secrets: inherit

  build-and-push:
    name: Build and push Docker image
    needs:
      - frontend-quality
      - backend-quality
      - email-templates-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/containers/web/Dockerfile
          target: production
          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          cache-from: type=gha,scope=staging
          cache-to: type=gha,mode=max,scope=staging

  clone-database:
    name: Make a copy of the database
    needs: build-and-push # prevent clone on failed workflows
    runs-on: ubuntu-latest
    steps:
      - name: Clone the prod database to staging database
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.INSTANCE_ADDRESS }}
          username: "ubuntu"
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          script: |
            set -e
            cd nantralPlatform/deployment/scripts
            chmod +x db_staging.sh
            ./db_staging.sh

  deploy:
    name: Deploy to staging
    needs:
      [ build-and-push, clone-database ]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.INSTANCE_ADDRESS }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY_DEPLOY }}
          script: |
            set -e
            cd nantralPlatform/deployment
            sed -i '/^STAGING_TAG=/d' .env
            echo "STAGING_TAG=${{ github.sha }}" >> .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend-staging
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
